name: OWILC
description: "Study World Cosultant"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # bloC state management
  flutter_bloc: ^9.1.1
  responsive_sizer: ^3.3.1
  curved_navigation_bar: ^1.0.6
  flutter_staggered_animations: ^1.1.1
  visibility_detector: ^0.4.0+2
  lottie: ^3.5.1
  dropdown_button2: ^3.1.0
  http: ^1.6.0
  equatable: ^2.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/splash_logo/logo.jpeg"
  min_sdk_android: 21
  remove_alpha_ios: true
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/splash_logo/
    - assets/onboarding_logo/
    - assets/popups/
    - assets/bottom_nav/
    - assets/loading_animation/